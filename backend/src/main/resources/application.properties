# =================================================================
# Exam Seating Auto Allocator - Production Configuration
# Supports Local H2, Render Cloud Platform, and Aiven Cloud DB
# =================================================================

# Server Port: Dynamic port assigned by Render ($PORT) or default 8080
server.port=${PORT:8080}

# Application Name
spring.application.name=exam-seating-auto-allocator

# Datasource Configuration:
# Defaults to in-memory H2 if no environment variable is provided.
# When deploying to Render with Aiven, set SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:examseatingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration:
# Let Hibernate auto-detect the SQL dialect based on the active JDBC connection (H2, MySQL, PostgreSQL)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available locally at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static Resource Serving
spring.web.resources.static-locations=classpath:/static/
